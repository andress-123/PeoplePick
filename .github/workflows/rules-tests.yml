name: Reglas de Firestore
on:
  push:
    paths: ["firestore.rules", "tests/**", "src/voteOps.js", ".github/workflows/rules-tests.yml"]
  pull_request:
    paths: ["firestore.rules", "tests/**", "src/voteOps.js"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:rules
