name: Bot de tendencias
on:
  schedule:
    - cron: "17 7-22 * * *"   # cada hora de 8:17 a 23:17 (hora peninsular en invierno)
  push:                         # al cambiar el bot: una pasada de prueba en simulación
    paths: ["bot/**", "data/**", ".github/workflows/bot.yml"]
  workflow_dispatch:
    inputs:
      modo:
        description: "simulacion o activo"
        default: "simulacion"
      demo:
        description: "ids de personas para tarjetas de prueba (ej: rosalia,pedro-sanchez)"
        default: ""
permissions:
  contents: write
concurrency: { group: bot, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Ejecutar el bot
        env:
          BOT_MODE: ${{ github.event_name == 'push' && 'simulacion' || github.event.inputs.modo || vars.BOT_MODE || 'simulacion' }}
          SITE_URL: ${{ vars.SITE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_DEMO: ${{ github.event_name == 'push' && 'rosalia,alberto-nunez-feijoo,lamine-yamal' || github.event.inputs.demo || vars.BOT_DEMO }}
        run: node bot/run.js
      - name: Publicar la previsualización en la rama bot-preview
        if: always()
        run: |
          [ -d bot/out ] || exit 0
          cd bot/out
          git init -q -b bot-preview
          git config user.name "peoplepick-bot"; git config user.email "peoplepick-bot@users.noreply.github.com"
          git add -A && git commit -qm "Previsualización $(date -u +%F' '%H:%M) UTC"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bot-preview
      - name: Guardar el historial (evita repetir personas)
        run: |
          if ! git diff --quiet bot/state.json; then
            git config user.name "peoplepick-bot"
            git config user.email "peoplepick-bot@users.noreply.github.com"
            git add bot/state.json && git commit -m "bot: historial de publicaciones" && git push
          fi
